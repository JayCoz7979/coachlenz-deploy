[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
preDeployCommand = "python -m backend.migrate"
startCommand = "sh -c 'uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 4'"
# Readiness (DB ping), not bare liveness: a deploy whose Postgres is unreachable
# should NOT be promoted to healthy. /health stays as a cheap liveness endpoint.
healthcheckPath = "/health/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
