name: CI

# Gate every push to main and every pull request. This is the first CI the repo
# has had: the fast unit gate must stay green for a branch to merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (byte-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Zero-config syntax gate: byte-compile the whole backend package so a
      # broken import or syntax error fails the PR before anything else runs.
      # (A style linter like ruff is a good follow-up once a config is agreed.)
      - run: python -m compileall -q backend

  unit-tests:
    name: unit tests (fast gate)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Placeholders so backend.config.Settings() (requires DATABASE_URL +
      # SECRET_KEY at import) loads without real secrets. conftest.py also sets
      # these; both layers are harmless and never real credentials.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/coachlenz_test
      SECRET_KEY: test-secret-key
      ANTHROPIC_API_KEY: test-anthropic-key
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run unit tests (no DB, no network)
        # Everything NOT marked integration or slow. Includes the sport-lock
        # enforcement + Stripe webhook signature smoke tests.
        run: pytest -m "not integration and not slow" -p no:cacheprovider -ra

  integration-tests:
    name: integration tests (in-process ASGI + SQLite)
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/coachlenz_test
      SECRET_KEY: test-secret-key
      ANTHROPIC_API_KEY: test-anthropic-key
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (+ SQLite driver for the self-contained app test)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install aiosqlite
      - name: Run integration tests
        # Self-contained: drives the real FastAPI app over a throwaway SQLite DB
        # via httpx ASGITransport. No external services required.
        run: pytest -m integration -p no:cacheprovider -ra

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # A build-time public fallback; the real value is set on the Railway service.
          NEXT_PUBLIC_API_URL: https://coachlenz-backend-production.up.railway.app

# NOTE (deferred, tracked): a coverage gate (--cov-fail-under=70) is intentionally
# NOT enabled yet. Total backend coverage today is well below 70%, so a hard gate
# would be red-on-arrival — worse than an honest green gate. Ratchet it up as the
# unit suites grow. The GPU/vision-bound smoke tests belong in a separate nightly
# workflow (marker: slow) once a golden clip + Modal/inference fixture exist.
