<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoachLenz is launching soon</title>
  <meta name="description" content="CoachLenz is launching soon for school basketball and football game film. Join the waitlist." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --green: #1a5c2a;
      --green-mid: #236b32;
      --gold: #C9A84C;
      --bg: #1c1c1c;
      --bg2: #2e2e2e;
      --bg3: #3d3d3d;
      --text: #f8f6f0;
      --muted: #a39e92;
      --line: rgba(255,255,255,0.08);
      --error: #e07070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid var(--line);
    }
    footer {
      border-bottom: 0;
      border-top: 1px solid var(--line);
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }
    a { color: #2d8c40; }
    .logo { height: 32px; width: auto; }
    .signin { color: var(--muted); text-decoration: none; font-size: 14px; }
    .signin:hover { color: var(--text); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .wrap { width: 100%; max-width: 520px; }
    .kicker {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      font-size: 12px;
      margin: 0 0 12px;
    }
    h1 { font-size: 40px; line-height: 1.1; margin: 0 0 16px; }
    .lede { color: var(--muted); font-size: 18px; line-height: 1.5; margin: 0 0 28px; }
    form, .success {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 22px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 6px;
    }
    label:first-of-type { margin-top: 0; }
    .opt { text-transform: none; letter-spacing: 0; }
    input, select {
      width: 100%;
      height: 48px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 2px;
      padding: 0 14px;
      font-size: 15px;
    }
    input:focus, select:focus { outline: 2px solid var(--gold); border-color: transparent; }
    button {
      margin-top: 18px;
      width: 100%;
      height: 48px;
      background: var(--gold);
      color: #1c1c1c;
      border: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #e2c06a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(224,112,112,0.12);
      color: var(--error);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .already { text-align: center; margin-top: 22px; color: var(--muted); }
    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      header, footer { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="coachlenz-logo.png" alt="CoachLenz" />
    <a class="signin" href="https://app.coachlenz.com/login">Sign in</a>
  </header>
  <main>
    <div class="wrap">
      <p class="kicker">Coming soon</p>
      <h1>CoachLenz is launching soon</h1>
      <p class="lede">Game film for school basketball and football. Leave your email and we will tell you when it opens. If you already have an account, you can still sign in.</p>
      <form id="waitlist" novalidate>
        <div id="error" class="error" hidden></div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@yourschool.org" />
        <label for="school">School <span class="opt">(optional)</span></label>
        <input id="school" name="school" type="text" maxlength="200" placeholder="Lincoln High" />
        <label for="sport">Sport <span class="opt">(optional)</span></label>
        <select id="sport" name="sport">
          <option value="">Sport (optional)</option>
          <option value="basketball">Basketball</option>
          <option value="football">Football</option>
          <option value="soccer">Soccer</option>
          <option value="volleyball">Volleyball</option>
          <option value="other">Other</option>
        </select>
        <button type="submit" id="submit">Join the waitlist</button>
      </form>
      <p class="already">Already have an account? <a href="https://app.coachlenz.com/login">Sign in</a></p>
    </div>
  </main>
  <footer>
    Powered by <a href="https://cosbyaisolutions.com">Cosby AI Solutions</a>
  </footer>
  <script>
    // Same unauthenticated endpoint the app waitlist uses. CORS already allows
    // https://coachlenz.com and https://www.coachlenz.com. Change this only if
    // the API host changes. Do not put secrets here.
    var WAITLIST_URL = "https://coachlenz-backend-production.up.railway.app/leads";

    var form = document.getElementById("waitlist");
    var errorBox = document.getElementById("error");
    var submitBtn = document.getElementById("submit");

    function showError(message) {
      errorBox.hidden = false;
      errorBox.textContent = message;
    }

    function emailProblem(value) {
      var v = (value || "").trim();
      if (!v) return "Email is required.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "Enter a valid email address.";
      return "";
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var email = document.getElementById("email").value;
      var school = document.getElementById("school").value.trim();
      var sport = document.getElementById("sport").value;
      var problem = emailProblem(email);
      if (problem) {
        showError(problem);
        return;
      }
      errorBox.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = "Joining...";
      var body = { email: email.trim(), source: "marketing-site" };
      if (school) body.school = school;
      if (sport) body.sport = sport;
      fetch(WAITLIST_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(function (res) {
        if (!res.ok) throw new Error("save failed");
        form.outerHTML = '<div class="success" role="status">You are on the list. We will email you when CoachLenz opens.</div>';
      }).catch(function () {
        showError("Could not join the waitlist. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Join the waitlist";
      });
    });
  </script>
</body>
</html>
