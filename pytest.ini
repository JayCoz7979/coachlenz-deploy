[pytest]
# Repo root is on sys.path so `import backend.<pkg>` resolves the backend package.
pythonpath = .
testpaths = backend/tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto

markers =
    unit: pure-logic tests — no DB, network, or secrets. The fast CI gate runs these.
    integration: needs a live Postgres / running app. Skipped by the fast gate.
    slow: GPU/vision/model-bound or otherwise long-running. Nightly only.

# Fast CI gate runs everything NOT marked integration or slow.
addopts = -ra -q
